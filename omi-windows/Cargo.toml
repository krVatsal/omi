[workspace]
resolver = "2"
members = [
    "crates/omi-app",
    "crates/omi-capture",
    "crates/omi-audio",
    "crates/omi-db",
    "crates/omi-transcription",
]

# BLE wearable support is disabled by default due to hardware limitations
# (requires BLE-capable adapter + Omi wearable device for testing).
# To build with BLE: cargo build -p omi-app --features ble
[workspace.metadata.optional-members]
ble = ["crates/omi-ble"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
